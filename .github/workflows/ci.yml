name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Linux Secret Service dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - run: npm run build
      - name: Native store and packed bundle (Linux)
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/linux-store-checks.sh
      - name: Native store and packed bundle (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          npm run test:store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - run: npm pack --dry-run
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history with checksum-pinned Gitleaks
        run: bash scripts/secret-scan.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
